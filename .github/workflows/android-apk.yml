# 每次推送都在云端编出安卓安装包，发布到仓库的 Releases 页面。
# 手机浏览器打开 Releases，下载 app-release.apk 即可安装。
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuage-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "刷歌试用版 #${{ github.run_number }}" \
            --notes "分支 ${{ github.ref_name }} 的自动构建（提交 ${SHORT_SHA}）。

          手机浏览器下载下面的 app-release.apk，打开安装。首次安装会提示允许「安装未知来源应用」。
          这是调试签名的试用包，不要上传到应用商店。"
